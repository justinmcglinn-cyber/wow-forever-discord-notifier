# Setup ('ForeverNotify.exe setup') writes this for you as config.toml. To do it by hand,
# copy this file to config.toml and fill in wow_dir and [webhooks] below.

# REQUIRED: your WoW Forever install folder, the one containing the Screenshots and WTF folders.
# Use single quotes so backslashes are kept as-is.
wow_dir = 'C:\Program Files (x86)\World of Warcraft\_forever_'

# Optional overrides if your folders live elsewhere:
# screenshots_dir = 'D:\WoW\_forever_\Screenshots'
# saved_variables_glob = 'D:\WoW\_forever_\WTF\Account\*\SavedVariables\ForeverNotify.lua'

# Delete the add-on's signal screenshots after reading them. Your own screenshots are never touched.
# At start-up, signal screenshots left over from while the companion wasn't running are cleaned up too.
delete_signal_screenshots = true

# Deaths and level-ups saved this many minutes before the companion started are still posted (marked late).
# Older leftover signals are deleted without posting.
catch_up_minutes = 10

# After logout, wait this long before posting the gold summary, in case it was a /reload.
summary_grace_seconds = 30

# How often to check for new screenshots (seconds).
poll_seconds = 0.2

# REQUIRED: the Discord channel each kind of message goes to, as webhook URLs
# (channel settings → Integrations → Webhooks → New Webhook → Copy Webhook URL).
# Keep them private: anyone with one can post to that channel.
# For one channel for everything, set only default. Any channel left empty uses default.
[webhooks]
default = ""
deaths = ""         # 💀 deaths, with the killer when known
level_ups = ""      # ⬆️ level-ups
pvp_alerts = ""     # ⚔️ "under attack" alerts
pvp_kills = ""      # 🗡️ your PvP kills and group battle reports
gold_summary = ""   # 💰 gold summary after logout
pvp_flag = ""       # PvP flag on/off (only if turned on in game with /fnotify flag); empty = pvp_alerts

# Turn a kind of message off (false) without touching the add-on.
[notify]
deaths = true
level_ups = true
pvp_alerts = true
pvp_kills = true
gold_summary = true
pvp_flag = true      # also needs /fnotify flag in game
test_messages = true # samples from /fnotify test

[mentions]
# Added to PvP alerts so your phone pings loudly, e.g. "<@123456789012345678>" (your Discord user ID).
pvp_alerts = ""
