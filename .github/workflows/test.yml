name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real Discord webhooks in the repo
        run: |
          if git grep -nIE 'discord(app)?\.com/api/webhooks/[0-9]{15,}'; then
            echo "A Discord webhook URL is committed. Remove it and recreate that webhook in Discord."
            exit 1
          fi
      - name: Release tag matches the add-on version (version tags only)
        # The updater compares the tag with the version in the exe; a mismatch would offer the same update forever.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^## Version: *//p' addon/ForeverNotify/ForeverNotify.toc | tr -d '\r')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match '## Version: $version' in ForeverNotify.toc. Bump the .toc, commit, and tag that commit."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lua 5.1 and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          pip install -r companion/requirements.txt
      - name: Syntax-check add-on
        run: for f in addon/ForeverNotify/*.lua; do luac5.1 -p "$f"; done
      - name: Add-on scenario (Lua 5.1 with stubbed WoW API)
        run: mkdir -p /tmp/out && lua5.1 tests/lua/run_scenario.lua addon/ForeverNotify /tmp/out
      - name: Companion tests
        working-directory: companion
        run: python -m unittest discover -s tests -t . -v

  build-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write      # build provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ForeverNotify.exe
        working-directory: companion
        run: .\build_exe.bat
      - name: Smoke-test the exe
        working-directory: companion
        run: .\dist\ForeverNotify.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverNotify-windows
          path: |
            companion/dist/ForeverNotify.exe
            companion/dist/config.example.toml
      - name: Zip the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          Compress-Archive -Path companion\dist\ForeverNotify.exe, companion\dist\config.example.toml, addon\ForeverNotify -DestinationPath ForeverNotify-${{ github.ref_name }}.zip
      - name: Attest build provenance (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        # Needs a public repo (or GitHub Enterprise); never blocks the release.
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            companion/dist/ForeverNotify.exe
            ForeverNotify-${{ github.ref_name }}.zip
      - name: Publish the release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = (Get-FileHash companion\dist\ForeverNotify.exe -Algorithm SHA256).Hash
          $zip = (Get-FileHash ForeverNotify-${{ github.ref_name }}.zip -Algorithm SHA256).Hash
          $notes = @(
            "Built by GitHub Actions from commit ${{ github.sha }} ([build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).",
            "",
            "SHA-256 of ``ForeverNotify.exe`` (attached, and inside the zip): ``$exe``",
            "SHA-256 of ``ForeverNotify-${{ github.ref_name }}.zip``: ``$zip``",
            "",
            "Check your copy in PowerShell: ``Get-FileHash .\ForeverNotify.exe``. With the GitHub CLI, ``gh attestation verify ForeverNotify.exe -R ${{ github.repository }}`` also confirms it was built here.",
            ""
          ) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          # The exe on its own is what the companion's updater downloads.
          gh release create ${{ github.ref_name }} ForeverNotify-${{ github.ref_name }}.zip companion\dist\ForeverNotify.exe --title ${{ github.ref_name }} --notes-file release-notes.md --generate-notes
