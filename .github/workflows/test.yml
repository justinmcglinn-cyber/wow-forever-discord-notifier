name: test

# Releases (tagged v<add-on version>) happen when:
# - main gets a commit whose add-on version ('## Version' in ForeverNotify.toc) isn't released yet,
# - someone runs this workflow by hand (Actions > test > Run workflow), optionally for an earlier commit, or
# - a matching v* tag is pushed.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit to release (leave empty for the latest on the chosen branch)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.release.outputs.tag }}      # e.g. v0.1.14, or empty when not releasing
      latest: ${{ steps.release.outputs.latest }}    # false when releasing an older version than one already out
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          fetch-depth: 0  # all tags, to check what's already released
      - name: No real Discord webhooks in the repo
        run: |
          if git grep -nIE 'discord(app)?\.com/api/webhooks/[0-9]{15,}'; then
            echo "A Discord webhook URL is committed. Remove it and recreate that webhook in Discord."
            exit 1
          fi
      - name: Release tag (version tags and manual releases)
        # The updater compares the tag with the version in the exe; a mismatch would offer the same update forever.
        id: release
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version=$(sed -n 's/^## Version: *//p' addon/ForeverNotify/ForeverNotify.toc | tr -d '\r')
          tag=""
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag is already released. Bump '## Version' in ForeverNotify.toc and commit before releasing again."
              exit 1
            fi
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
            if [ "v$version" != "$tag" ]; then
              echo "Tag $tag doesn't match '## Version: $version' in ForeverNotify.toc. Bump the .toc, commit, and tag that commit."
              exit 1
            fi
          elif [ "$EVENT" = "push" ] && [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            # A new add-on version on main is released; any other push to main only builds.
            if ! git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then tag="v$version"; fi
          fi
          latest=true
          highest=$(git tag -l 'v*' | sort -V | tail -1)
          if [ -n "$tag" ] && [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$tag" | sort -V | tail -1)" != "$tag" ]; then
            latest=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ -n "$tag" ]; then echo "Releasing $tag from $(git rev-parse --short HEAD) (latest: $latest)"; fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lua 5.1 and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1
          pip install -r companion/requirements.txt
      - name: Syntax-check add-on
        run: for f in addon/ForeverNotify/*.lua; do luac5.1 -p "$f"; done
      - name: Add-on scenario (Lua 5.1 with stubbed WoW API)
        run: mkdir -p /tmp/out && lua5.1 tests/lua/run_scenario.lua addon/ForeverNotify /tmp/out
      - name: Companion tests
        working-directory: companion
        run: python -m unittest discover -s tests -t . -v

  build-exe:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write      # build provenance attestation
      attestations: write
    env:
      TAG: ${{ needs.test.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build ForeverNotify.exe
        working-directory: companion
        run: .\build_exe.bat
      - name: Smoke-test the exe
        working-directory: companion
        run: .\dist\ForeverNotify.exe --help
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverNotify-windows
          path: |
            companion/dist/ForeverNotify.exe
            companion/dist/config.example.toml
      - name: Zip the release (releases only)
        if: needs.test.outputs.release != ''
        run: |
          Compress-Archive -Path companion\dist\ForeverNotify.exe, companion\dist\config.example.toml, addon\ForeverNotify -DestinationPath "ForeverNotify-$env:TAG.zip"
      - name: Attest build provenance (releases only)
        if: needs.test.outputs.release != ''
        # Needs a public repo (or GitHub Enterprise); never blocks the release.
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            companion/dist/ForeverNotify.exe
            ForeverNotify-${{ needs.test.outputs.release }}.zip
      - name: Publish the release (releases only)
        if: needs.test.outputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.test.outputs.sha }}
          LATEST: ${{ needs.test.outputs.latest }}
        run: |
          $exe = (Get-FileHash companion\dist\ForeverNotify.exe -Algorithm SHA256).Hash
          $zip = (Get-FileHash "ForeverNotify-$env:TAG.zip" -Algorithm SHA256).Hash
          $notes = @(
            "Built by GitHub Actions from commit $env:SHA ([build log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).",
            "",
            "SHA-256 of ``ForeverNotify.exe`` (attached, and inside the zip): ``$exe``",
            "SHA-256 of ``ForeverNotify-$env:TAG.zip``: ``$zip``",
            "",
            "Check your copy in PowerShell: ``Get-FileHash .\ForeverNotify.exe``. With the GitHub CLI, ``gh attestation verify ForeverNotify.exe -R ${{ github.repository }}`` also confirms it was built here.",
            ""
          ) -join "`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          # The exe on its own is what the companion's updater downloads. --target creates the tag when it
          # doesn't exist yet (manual releases); a pushed tag is used as it is.
          gh release create $env:TAG "ForeverNotify-$env:TAG.zip" companion\dist\ForeverNotify.exe --target $env:SHA --title $env:TAG --latest=$env:LATEST --notes-file release-notes.md --generate-notes
